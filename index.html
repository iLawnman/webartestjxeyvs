<head>

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>AR.js Hiro Test</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;

            left: 10px;

            padding: 10px 14px;

            background: rgba(0, 0, 0, 0.7);

            color: white;

            font-family: Arial, sans-serif;

            font-size: 14px;

            border-radius: 5px;
        }
    </style>

<body>

<div id="status">
    Loading AR.js...
</div>

    IMPORTANT:

    Do NOT add another Three.js here.

    Three.js / THREEx integration.
-->

<script src="ar.js"></script>

</html>
