<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>AR.js Hiro</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        canvas {
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
        }

        #status {
            position: fixed;
            z-index: 100;

            top: 10px;
            left: 10px;

            padding: 8px 12px;

            color: white;
            background: rgba(0, 0, 0, .7);

            font-family: Arial, sans-serif;
            font-size: 14px;

            border-radius: 4px;
        }
    </style>
</head>

<body>

<div id="status">
    Starting AR...
</div>

<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<!-- AR.js -->
<script src="https://cdn.jsdelivr.net/npm/ar.js@3.4.8/three.js/build/ar.js"></script>

<script src="ar.js"></script>
<script src="tree.js"></script>

</body>
</html>
