<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
  <title>AR — Hiro + asset.png</title>

  <!-- Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

  <!-- AR.js (Three.js версия) -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/three.js/build/ar-threex.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Камера на весь экран */
    video {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      z-index: 0 !important;
    }

    canvas {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 1 !important;
    }

    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #fff;
      z-index: 20;
      font-size: 18px;
    }

    /* Статус в правом верхнем углу */
    #status {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 15;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
      min-width: 160px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.15);
      pointer-events: none;
      user-select: none;
    }
    #status .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    #status .label { opacity: 0.7; }
    #status .value { font-weight: 600; }
    #status .ok { color: #4ade80; }
    #status .search { color: #fbbf24; }
    #status .err { color: #f87171; }
  </style>
</head>
<body>
  <div id="loader">Загрузка камеры…</div>

  <div id="status">
    <div class="row"><span class="label">AR</span><span class="value" id="st-ar">загрузка…</span></div>
    <div class="row"><span class="label">Маркер</span><span class="value" id="st-marker">—</span></div>
    <div class="row"><span class="label">FPS</span><span class="value" id="st-fps">—</span></div>
  </div>

  <script src="tree.js"></script>
  <script src="ar.js"></script>
</body>
</html>
