<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Three.js AR Hiro Marker</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
        }

        #status {
            position: fixed;
            left: 10px;
            top: 10px;
            z-index: 1000;

            padding: 8px 12px;

            color: white;
            background: rgba(0, 0, 0, 0.6);

            font-family: Arial, sans-serif;
            font-size: 14px;

            border-radius: 4px;
        }
    </style>
</head>

<body>

<div id="status">Initializing AR...</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/TextureLoader.js"></script>

<script src="https://cdn.jsdelivr.net/npm/ar.js@3.4.7/three.js/build/ar.js"></script>

<script src="ar.js"></script>
<script src="tree.js"></script>

</body>
</html>
